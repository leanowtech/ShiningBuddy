name: 问题反馈
description: 反馈安装、运行或交互问题
body:
  - type: markdown
    attributes:
      value: 请勿提供密码、密钥、完整配置、实例数据库或业务文件。
  - type: input
    id: version
    attributes:
      label: Shining Buddy 版本
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 系统与 CPU 架构
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤、期望结果和实际结果
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 脱敏错误或截图
